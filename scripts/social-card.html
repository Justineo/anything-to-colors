<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anything to colors — social card artwork</title>
    <style>
      @font-face {
        font-family: "Geist Serif";
        src: url("/src/assets/geist-serif.woff2") format("woff2");
        font-weight: 400;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #101b48;
        color: var(--ink, #f4f8ff);
        font-family: "Geist Serif", serif;
      }
      canvas,
      .shade {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
      }
      .shade {
        background: var(--shade, linear-gradient(90deg, #0a123c77, #0a123c05 85%));
      }
      main {
        position: relative;
        padding: 100px 88px;
      }
      h1 {
        margin: 0 0 30px;
        font-size: 100px;
        line-height: 1.05;
        font-weight: 400;
        letter-spacing: -4px;
      }
      p {
        margin: 0;
        font-size: 27px;
        line-height: 1.5;
      }
      footer {
        position: absolute;
        inset: auto 88px 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 20px;
      }
      .palette {
        display: flex;
        width: 200px;
        height: 18px;
        overflow: hidden;
        border-radius: 9px;
        box-shadow: 0 0 0 1px #ffffff26;
      }
      .palette span {
        flex: 1;
        background: var(--color);
      }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>
    <div class="shade"></div>
    <main>
      <h1>Anything<br />to colors</h1>
      <p>Everything you imagine has its colors.</p>
    </main>
    <footer>
      <div class="palette" aria-hidden="true"></div>
      <span>colors.void.app</span>
    </footer>
    <script type="module" src="/scripts/social-card.ts"></script>
  </body>
</html>
